bug:
  - head-branch:
      - ^fix
      - fix
      - ^hotfix
      - hotfix

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**
          - examples/**
          - scripts/*.ps1
  - head-branch:
      - ^docs
      - documentation

enhancement:
  - head-branch:
      - ^feature
      - feature
      - ^improve
      - improve

packaging:
  - changed-files:
      - any-glob-to-any-file:
          - .dockerignore
          - builder/**/*
          - Dockerfile
          - .dockerignore
          - qgis_deployment_toolbelt/utils/frozen_app.py
  - head-branch:
      - ^packaging
      - packaging

quality:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*

tooling:
  - changed-files:
      - any-glob-to-any-file:
          - ".*"
          - codecov.yml
          - pyproject.toml
          - sonar-project.properties
          - .vscode/**/*
  - head-branch:
      - ^tooling
      - tooling

# Scopes
"scope: logging":
  - changed-files:
      - any-glob-to-any-file:
          - qgis_deployment_toolbelt/utils/journalizer.py

"scope: jobs":
